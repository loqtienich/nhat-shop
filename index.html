<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>NHAT SHOP</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f5f5f5;
color: #222;
}

header {
background: white;
padding: 15px 5%;
display: flex;
align-items: center;
gap: 20px;
position: sticky;
top: 0;
z-index: 10;
box-shadow: 0 2px 10px #ddd;
}

.logo {
font-size: 25px;
font-weight: bold;
color: #ff3b30;
}

.search {
flex: 1;
display: flex;
}

.search input {
width: 100%;
padding: 12px;
border: 1px solid #ddd;
border-radius: 8px 0 0 8px;
}

.search button {
width: 50px;
border: none;
background: #ff3b30;
color: white;
border-radius: 0 8px 8px 0;
}

.cart {
border: none;
background: white;
font-size: 20px;
}

.hero {
text-align: center;
padding: 70px 20px;
color: white;
background: linear-gradient(
135deg,
#ff3b30,
#ff8178
);
}

.hero h1 {
font-size: 45px;
margin: 0;
}

.hero button {
padding: 12px 30px;
border: none;
border-radius: 25px;
background: white;
color: #ff3b30;
font-weight: bold;
}

main {
max-width: 1200px;
margin: auto;
padding: 30px 20px;
}

.products {
display: grid;
grid-template-columns:
repeat(4, 1fr);
gap: 20px;
}

.product {
background: white;
border-radius: 12px;
overflow: hidden;
box-shadow: 0 3px 10px #ddd;
}

.product img {
width: 100%;
height: 230px;
object-fit: cover;
}

.info {
padding: 15px;
}

.price {
font-size: 20px;
font-weight: bold;
color: #ff3b30;
margin: 10px 0;
}

.buy {
width: 100%;
padding: 12px;
border: none;
border-radius: 8px;
background: #ff3b30;
color: white;
font-weight: bold;
}

footer {
margin-top: 50px;
padding: 30px;
text-align: center;
background: #222;
color: white;
}

@media(max-width:800px) {

.products {
grid-template-columns:
repeat(2,1fr);
}

}

</style>

</head>

<body>

<header>

<div class="logo">
NHAT SHOP
</div>

<div class="search">

<input
id="search"
placeholder="Tìm sản phẩm..."
oninput="searchProducts()"
>

<button>🔍</button>

</div>

<button class="cart">
🛒 <span id="count">0</span>
</button>

</header>


<section class="hero">

<h1>NHAT SHOP</h1>

<p>
Thời trang đẹp - Giá tốt mỗi ngày
</p>

<button
onclick="document.querySelector('main').scrollIntoView()"
>
Mua ngay
</button>

</section>


<main>

<h2>Sản phẩm nổi bật</h2>

<div
id="products"
class="products"
></div>

</main>


<footer>

© 2026 NHAT SHOP

</footer>


<script>

const products = [

{
name:"Áo thun nam",
price:150000,
image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
},

{
name:"Giày thể thao",
price:450000,
image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"
},

{
name:"Túi đeo chéo",
price:250000,
image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62"
},

{
name:"Mũ thời trang",
price:120000,
image:"https://images.unsplash.com/photo-1521369909029-2afed882baee"
}

];


let cart = 0;


function showProducts(list) {

const box =
document.getElementById("products");

box.innerHTML = "";

list.forEach(product => {

box.innerHTML += `

<div class="product">

<img src="${product.image}">

<div class="info">

<h3>
${product.name}
</h3>

<div class="price">
${product.price.toLocaleString("vi-VN")}đ
</div>

<button
class="buy"
onclick="addCart()"
>
🛒 Thêm vào giỏ
</button>

</div>

</div>

`;

});

}


function addCart() {

cart++;

document.getElementById("count")
.textContent = cart;

alert("Đã thêm vào giỏ hàng!");

}


function searchProducts() {

const keyword =
document.getElementById("search")
.value
.toLowerCase();

const result =
products.filter(product =>
product.name
.toLowerCase()
.includes(keyword)
);

showProducts(result);

}


showProducts(products);

</script>

</body>

</html>
